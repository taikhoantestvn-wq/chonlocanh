name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip source
        run: unzip *.zip -d app_source

      - name: Fix versions and config
        run: |
          FILE=$(find app_source -name "libs.versions.toml" | head -1)
          if [ -f "$FILE" ]; then
            sed -i 's/googleDevtoolsKsp = "[^"]*"/googleDevtoolsKsp = "2.2.10-2.0.2"/' "$FILE"
            echo "Versions after fix:"
            grep -E "kotlin|ksp|googleDevtools" "$FILE"
          fi
          PROPS=$(find app_source -name "gradle.properties" | head -1)
          if [ -f "$PROPS" ]; then
            echo "android.disallowKotlinSourceSets=false" >> "$PROPS"
            echo "Fixed gradle.properties"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle wrapper
        run: |
          DIR=$(find app_source -name "build.gradle.kts" | grep -v "app/" | head -1 | xargs dirname)
          echo "Project dir: $DIR"
          cd "$DIR"
          gradle wrapper --gradle-version 9.3.1
          touch .env

      - name: Build APK
        run: |
          DIR=$(find app_source -name "build.gradle.kts" | grep -v "app/" | head -1 | xargs dirname)
          cd "$DIR"
          chmod +x gradlew
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: "**/*.apk"
          retention-days: 30
